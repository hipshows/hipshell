[package]
name = "hipssh"
version = "1.3.0"
authors = ["HiPsHoW"]
edition = "2024"
description = "GUI 与 MCP 共用后台的轻量 SSH 客户端"
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:rfd", "dep:icu_normalizer"]

[dependencies]
anyhow = "1"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
des = "0.8"
md5 = "0.7"
rand = "0.8"
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "fs", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "0.16"
unicode-width = "0.2"
zeroize = "1"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030", "unstable-fontique-011"] }
# common-controls-v6: Windows 确认框支持自定义按钮文字 (覆盖/保留两者), 需配合 build.rs 嵌入的清单.
rfd = { version = "0.15", optional = true, features = ["common-controls-v6"] }

# Windows 另启用 Skia 渲染器 (Slint 优先使用): 字形微调与 LCD 抗锯齿让小字号清晰, 显卡不可用时退回软件渲染.
# 首次编译会从 GitHub 下载 Skia 预编译库.
[target.'cfg(windows)'.dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["renderer-skia"] }

# macOS 界面下载时文件名比较用 Unicode 归一化 (APFS 视 é 的两种编码为同名); 复用 Slint 已依赖的版本.
[target.'cfg(target_os = "macos")'.dependencies]
icu_normalizer = { version = "2", optional = true, default-features = false, features = ["compiled_data"] }

# 只在 Windows 上编译时使用: 把图标和版本信息嵌入 exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0

# 依赖开启基础优化, 开发版的软件渲染和 SSH 加解密接近发布版手感; 本项目代码仍快速编译.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
